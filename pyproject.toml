[project]
name = "claude-chat-fetch"
version = "0.1.0"
description = "Fetch your recent claude.ai conversations to markdown using your logged-in Chrome session (Linux)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["curl_cffi>=0.7", "pycryptodome>=3.20"]

[project.scripts]
claude-chat-fetch = "claude_chat_fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["claude_chat_fetch.py"]
